  <style>
    :root{--bg:#0f172a;--card:#1e293b;--accent:#38bdf8;--accent2:#a78bfa;--text:#f1f5f9;--muted:#94a3b8;--success:#34d399;--danger:#f87171;--radius:16px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px;line-height:1.5}
    header{width:100%;max-width:480px;text-align:center;padding:16px 0 8px}
    header h1{font-size:1.35rem;font-weight:700;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    header p{color:var(--muted);font-size:.85rem;margin-top:4px}
    .stats{display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap}
    .stat{background:var(--card);padding:6px 12px;border-radius:999px;font-size:.78rem;color:var(--muted)}
    .stat strong{color:var(--accent)}
    .filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
    .filter-btn{background:var(--card);border:1px solid transparent;color:var(--muted);padding:5px 11px;border-radius:999px;font-size:.75rem;cursor:pointer}
    .filter-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(56,189,248,.12)}
    .progress-bar{width:100%;max-width:420px;height:5px;background:var(--card);border-radius:999px;margin:8px 0;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .3s}
    .card-container{width:100%;max-width:420px;perspective:1200px;margin-bottom:16px}
    .card{width:100%;min-height:400px;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1);cursor:pointer}
    .card.flipped{transform:rotateY(180deg)}
    .card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);background:var(--card);padding:22px 18px;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.4);overflow-y:auto}
    .card-front{justify-content:center;align-items:center;text-align:center}
    .card-back{transform:rotateY(180deg)}
    .word{font-size:1.9rem;font-weight:700;letter-spacing:-.4px;margin-bottom:6px}
    .phonetic{color:var(--accent);font-size:.95rem;margin-bottom:12px}
    .category-tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.68rem;font-weight:600;margin-bottom:14px}
    .cat-foundations{background:rgba(56,189,248,.18);color:#7dd3fc}
    .cat-architecture{background:rgba(167,139,250,.2);color:#c4b5fd}
    .cat-llm{background:rgba(52,211,153,.18);color:#6ee7b7}
    .cat-agent{background:rgba(251,146,60,.18);color:#fdba74}
    .cat-training{background:rgba(244,114,182,.18);color:#f9a8d4}
    .cat-eval{background:rgba(248,113,113,.18);color:#fca5a5}
    .cat-infra{background:rgba(148,163,184,.2);color:#cbd5e1}
    .scene-box{background:rgba(15,23,42,.55);border-left:3px solid var(--accent2);padding:12px 14px;border-radius:0 10px 10px 0;margin:12px 0;font-size:.9rem;color:#e2e8f0}
    .scene-box .label{font-size:.68rem;color:var(--accent2);letter-spacing:.5px;margin-bottom:5px;display:block}
    .definition{font-size:1rem;margin-bottom:8px;color:#e2e8f0}
    .example{font-size:.85rem;color:var(--muted);font-style:italic;border-top:1px solid rgba(148,163,184,.2);padding-top:10px;margin-top:6px}
    .actions{display:flex;gap:10px;width:100%;max-width:420px}
    .btn{flex:1;padding:13px;border:none;border-radius:12px;font-size:.95rem;font-weight:600;cursor:pointer}
    .btn-know{background:var(--success);color:#064e3b}
    .btn-unknown{background:var(--danger);color:#7f1d1d}
    .btn-next{background:var(--card);color:var(--text);border:1px solid rgba(148,163,184,.3);margin-top:10px;width:100%;max-width:420px;padding:12px;border-radius:12px;font-size:.95rem;font-weight:600;cursor:pointer}
    #installBtn{display:none;margin-top:14px;width:100%;max-width:420px;padding:13px;border:none;border-radius:12px;font-size:.95rem;font-weight:600;cursor:pointer;background:linear-gradient(90deg,#38bdf8,#a78bfa);color:#0f172a}
    footer{margin-top:auto;padding:16px;font-size:.72rem;color:var(--muted);text-align:center}
    .empty{text-align:center;color:var(--muted);padding:50px 20px}
    @media(max-width:400px){.word{font-size:1.6rem}.card{min-height:360px}}
  </style>
</head>

<script>
const WORDS=[
{word:'AI',phonetic:'/ˌeɪˈaɪ/',category:'foundations',definition:'人工智能——让机器完成通常需要人类智能的任务',scene:'会思考、会学习的机器人，能看图、听话、做决定。',example:'AI is transforming every industry.'},
{word:'Machine Learning',phonetic:'/məˈʃiːn ˈlɜːrnɪŋ/',category:'foundations',definition:'机器学习——让计算机从数据中学习规律而非写死规则',scene:'小孩看很多猫照片后自己学会认猫。',example:'Machine learning powers recommendation systems.'},
{word:'Deep Learning',phonetic:'/diːp ˈlɜːrnɪŋ/',category:'foundations',definition:'深度学习——用多层神经网络学习复杂模式',scene:'大脑多层神经元：边缘→形状→物体。',example:'Deep learning drives modern computer vision.'},
{word:'Supervised Learning',phonetic:'/ˈsuːpəvaɪzd/',category:'foundations',definition:'监督学习——用带标签数据训练模型',scene:'老师批改作业，学生照着学。',example:'Supervised learning needs labeled data.'},
{word:'Unsupervised Learning',phonetic:'/ʌnˈsuːpəvaɪzd/',category:'foundations',definition:'无监督学习——从无标签数据中找模式',scene:'给学生一堆照片让自己分组。',example:'Clustering is unsupervised learning.'},
{word:'Reinforcement Learning',phonetic:'/ˌriːɪnˈfɔːsmənt/',category:'foundations',definition:'强化学习——通过奖励与惩罚学会行动',scene:'训狗：做对给零食，做错不给。',example:'RL is used in robotics and games.'},
{word:'Self-Supervised Learning',phonetic:'/self/',category:'foundations',definition:'自监督学习——模型自己从数据生成标签',scene:'挖掉句子里的词让模型猜。',example:'Self-supervised learning powers LLM pretraining.'},
{word:'Semi-Supervised Learning',phonetic:'/ˌsemi/',category:'foundations',definition:'半监督学习——少量标签+大量无标签一起训练',scene:'老师只批几本，其余自己摸索。',example:'Semi-supervised cuts labeling cost.'},
{word:'Transfer Learning',phonetic:'/ˈtrænsfɜː/',category:'foundations',definition:'迁移学习——把已学知识迁移到新任务',scene:'会骑车的人学摩托车更快。',example:'Transfer learning reduces training cost.'},
{word:'Generative AI',phonetic:'/ˈdʒenərətɪv/',category:'foundations',definition:'生成式AI——能创造新内容的AI',scene:'自己画出从未存在的猫。',example:'Generative AI creates text, images and code.'},

{word:'Dataset',phonetic:'/ˈdeɪtəset/',category:'foundations',definition:'数据集——训练/验证/测试用的数据集合',scene:'一箱标好标签的照片。',example:'A high-quality dataset is critical.'},

{word:'Model',phonetic:'/ˈmɒdl/',category:'foundations',definition:'模型——训练后能做预测的系统',scene:'学完后会认猫的程序。',example:'Deploy the trained model to production.'},
{word:'Inference',phonetic:'/ˈɪnfərəns/',category:'foundations',definition:'推理——用已训练模型生成结果',scene:'上学是训练，工作是推理。',example:'Inference is charged per token.'},

{word:'Bias',phonetic:'/ˈbaɪəs/',category:'foundations',definition:'偏差——系统性偏离或数据偏见',scene:'秤总是少称一点。',example:'Data bias can harm fairness.'},
{word:'Variance',phonetic:'/ˈveəriəns/',category:'foundations',definition:'方差——对数据变化的敏感程度',scene:'分数忽高忽低。',example:'High variance often means overfitting.'},
{word:'Normalization',phonetic:'/ˌnɔːməlaɪˈzeɪʃn/',category:'foundations',definition:'归一化——把数据缩放到统一范围',scene:'把不同身高缩到同一比例。',example:'Batch norm stabilizes training.'},
{word:'Regularization',phonetic:'/ˌreɡjʊləraɪˈzeɪʃn/',category:'foundations',definition:'正则化——防止过拟合的技术',scene:'给模型加点惩罚不让记太死。',example:'Weight decay is regularization.'},
{word:'Feature Engineering',phonetic:'/ˈfiːtʃə/',category:'foundations',definition:'特征工程——设计有用输入特征',scene:'把原料加工成更好食材。',example:'Good features beat complex models.'},
{word:'Cross-Validation',phonetic:'/krɒs/',category:'foundations',definition:'交叉验证——轮流当验证集评估模型',scene:'轮流当考官更公平。',example:'K-fold cross-validation is standard.'},
{word:'Ensemble',phonetic:'/ɒnˈsɒmbl/',category:'foundations',definition:'集成学习——组合多个模型提升表现',scene:'三个臭皮匠顶个诸葛亮。',example:'Random forests are ensembles.'},
{word:'Decision Tree',phonetic:'/dɪˈsɪʒn/',category:'foundations',definition:'决策树——用是/否问题做预测的树',scene:'流程图一路问到结论。',example:'Decision trees are interpretable.'},
{word:'Random Forest',phonetic:'/ˈrændəm/',category:'foundations',definition:'随机森林——多棵决策树投票',scene:'一片树一起投票更稳。',example:'Random forests resist overfitting.'},
{word:'Gradient Boosting',phonetic:'/ˈɡreɪdiənt/',category:'foundations',definition:'梯度提升——依次针对错误提升弱学习器',scene:'后一个补前一个的漏洞。',example:'XGBoost is popular boosting.'},
{word:'K-Means',phonetic:'/keɪ miːnz/',category:'foundations',definition:'K均值聚类——把数据分成K个簇',scene:'自动把相似点归组。',example:'K-means is simple clustering.'},
{word:'PCA',phonetic:'/ˌpiːsiːˈeɪ/',category:'foundations',definition:'主成分分析——降维并保留主要信息',scene:'高维压到主要方向。',example:'PCA reduces dimensionality.'},
{word:'Neural Network',phonetic:'/ˈnjʊərəl/',category:'architecture',definition:'神经网络——多层互连神经元组成的模型',scene:'模仿大脑神经元传递信号。',example:'Neural networks power deep learning.'},
{word:'Neuron',phonetic:'/ˈnjʊərɒn/',category:'architecture',definition:'神经元——单个计算单元',scene:'小开关，信号够强才往下传。',example:'Each neuron applies weights and activation.'},
{word:'Layer',phonetic:'/ˈleɪə/',category:'architecture',definition:'层——同阶段处理数据的一组神经元',scene:'流水线的一站。',example:'Deeper layers capture higher features.'},
{word:'Weight',phonetic:'/weɪt/',category:'architecture',definition:'权重——连接强度数值',scene:'调音台旋钮。',example:'Training adjusts millions of weights.'},
{word:'Activation Function',phonetic:'/ˌæktɪˈveɪʃn/',category:'architecture',definition:'激活函数——决定是否/如何传递信号',scene:'门卫：信号够强才放行。',example:'ReLU is a popular activation.'},
{word:'Backpropagation',phonetic:'/ˌbækprɒpəˈɡeɪʃn/',category:'architecture',definition:'反向传播——从误差反向计算如何调权重',scene:'从最后一题往前找错因。',example:'Backpropagation enables training.'},
{word:'CNN',phonetic:'/ˌsiːenˈen/',category:'architecture',definition:'卷积神经网络——擅长图像的网络',scene:'小窗口滑动找边缘纹理。',example:'CNNs dominate computer vision.'},
{word:'RNN',phonetic:'/ˌɑːrenˈen/',category:'architecture',definition:'循环神经网络——处理序列的早期架构',scene:'读句子记住前面的词。',example:'RNNs were common before transformers.'},
{word:'LSTM',phonetic:'/ˌelestiːˈem/',category:'architecture',definition:'长短期记忆网络——更好记住长序列的RNN变体',scene:'带记忆门，重要信息多留一会。',example:'LSTMs helped longer sequences.'},
{word:'Transformer',phonetic:'/trænsˈfɔːmə/',category:'architecture',definition:'Transformer——现代大模型核心架构',scene:'全班同时互相听，关注最相关的人。',example:'Transformers power modern LLMs.'},
{word:'Attention',phonetic:'/əˈtenʃn/',category:'architecture',definition:'注意力机制——判断序列哪些部分更重要',scene:'阅读时盯关键词。',example:'Self-attention is key to transformers.'},
{word:'Self-Attention',phonetic:'/self/',category:'architecture',definition:'自注意力——序列内每个位置关注其他位置',scene:'每个词看其他词决定如何理解。',example:'Self-attention enables parallelism.'},
{word:'Multi-Head Attention',phonetic:'/ˈmʌlti hed/',category:'architecture',definition:'多头注意力——并行多组注意力',scene:'好几双眼睛不同角度观察。',example:'Multi-head captures diverse relations.'},
{word:'Positional Encoding',phonetic:'/pəˈzɪʃənl/',category:'architecture',definition:'位置编码——告诉模型词的位置',scene:'给每个词贴「第几个」标签。',example:'Transformers need positional encoding.'},
{word:'Encoder',phonetic:'/ɪnˈkəʊdə/',category:'architecture',definition:'编码器——把输入压缩成表示',scene:'长文压成精华摘要。',example:'The encoder understands input.'},
{word:'Decoder',phonetic:'/diːˈkəʊdə/',category:'architecture',definition:'解码器——从表示生成输出',scene:'根据摘要写出完整句子。',example:'The decoder generates output.'},
{word:'Residual Connection',phonetic:'/rɪˈzɪdjuəl/',category:'architecture',definition:'残差连接——输入跳过一层再相加',scene:'走捷径防止深层信息丢失。',example:'ResNets use residual connections.'},
{word:'Mixture of Experts',phonetic:'/ˈmɪkstʃə/',category:'architecture',definition:'混合专家——只激活部分专家子网络',scene:'按问题找对应专家。',example:'MoE scales efficiently.'},
{word:'Parameter',phonetic:'/pəˈræmɪtə/',category:'architecture',definition:'参数——模型内部学习的数值',scene:'几百亿个旋钮。',example:'A 70B model has 70 billion parameters.'},
{word:'LoRA',phonetic:'/ˈlɔːrə/',category:'architecture',definition:'低秩适配——只训练少量新增矩阵微调',scene:'不改整书只加便利贴。',example:'LoRA makes fine-tuning cheap.'},

{word:'Quantization',phonetic:'/ˌkwɒntaɪˈzeɪʃn/',category:'architecture',definition:'量化——更低精度表示权重',scene:'高清压成小文件。',example:'INT8 speeds up inference.'},

{word:'Multimodal',phonetic:'/ˌmʌltiˈməʊdl/',category:'architecture',definition:'多模态——同时处理文字图像音频等',scene:'既能看图又能听声。',example:'GPT-4o is multimodal.'},

let currentFilter="all",currentIndex=0,deck=[],progress=JSON.parse(localStorage.getItem("aiVocabProgress")||"{}");
const catMap={foundations:"基础",architecture:"架构",llm:"LLM",agent:"智能体",training:"训练",eval:"评估安全",infra:"部署运维"};
const catClass={foundations:"cat-foundations",architecture:"cat-architecture",llm:"cat-llm",agent:"cat-agent",training:"cat-training",eval:"cat-eval",infra:"cat-infra"};
function initProgress(){WORDS.forEach(w=>{if(!progress[w.word])progress[w.word]={status:"new",lastSeen:0}});saveProgress()}
function saveProgress(){localStorage.setItem("aiVocabProgress",JSON.stringify(progress))}
function buildDeck(){
  let filtered=currentFilter==="all"?WORDS:WORDS.filter(w=>w.category===currentFilter);
  deck=filtered.sort((a,b)=>{const o={unknown:0,new:1,known:2};return(o[progress[a.word]?.status||"new"]||1)-(o[progress[b.word]?.status||"new"]||1)});
  currentIndex=0;updateStats();deck.length?showCard():showEmpty()
}
function updateStats(){
  const learned=Object.values(progress).filter(p=>p.status==="known").length;
  const remaining=WORDS.length-learned;
  const review=Object.values(progress).filter(p=>p.status==="unknown").length;
  document.getElementById("learned").textContent=learned;
  document.getElementById("remaining").textContent=remaining;
  document.getElementById("review").textContent=review;
  document.getElementById("progress").style.width=(WORDS.length?Math.round(learned/WORDS.length*100):0)+"%"
}
function showEmpty(){
  document.getElementById("cardContainer").innerHTML='<div class="empty"><p style="font-size:1.15rem;margin-bottom:6px">🎉 太棒了！</p><p>当前分类都已掌握</p></div>';
  document.getElementById("btnKnow").disabled=true;document.getElementById("btnUnknown").disabled=true
}
function showCard(){
  if(!deck.length)return showEmpty();
  const w=deck[currentIndex];
  const card=document.getElementById("card");
  if(!card||!document.getElementById("frontWord")){
    document.getElementById("cardContainer").innerHTML=`<div class="card" id="card"><div class="card-face card-front"><div class="category-tag" id="frontTag"></div><div class="word" id="frontWord"></div><div class="phonetic" id="frontPhonetic"></div><p style="color:var(--muted);font-size:.82rem;margin-top:16px">点击卡片翻转 · 场景记忆</p></div><div class="card-face card-back"><div class="category-tag" id="backTag"></div><div class="word" id="backWord" style="font-size:1.35rem"></div><div class="phonetic" id="backPhonetic"></div><div class="definition" id="definition"></div><div class="scene-box"><span class="label">🎬 场景画面</span><span id="scene"></span></div><div class="example" id="example"></div></div></div>`;
    document.getElementById("card").addEventListener("click",()=>document.getElementById("card").classList.toggle("flipped"))
  }
  document.getElementById("card").classList.remove("flipped");
  document.getElementById("frontWord").textContent=w.word;
  document.getElementById("frontPhonetic").textContent=w.phonetic;
  document.getElementById("frontTag").textContent=catMap[w.category]||w.category;
  document.getElementById("frontTag").className="category-tag "+(catClass[w.category]||"");
  document.getElementById("backWord").textContent=w.word;
  document.getElementById("backPhonetic").textContent=w.phonetic;
  document.getElementById("backTag").textContent=catMap[w.category]||w.category;
  document.getElementById("backTag").className="category-tag "+(catClass[w.category]||"");
  document.getElementById("definition").textContent=w.definition;
  document.getElementById("scene").textContent=w.scene;
  document.getElementById("example").textContent=w.example;
  document.getElementById("btnKnow").disabled=false;document.getElementById("btnUnknown").disabled=false
}
function mark(status){
  if(!deck.length)return;
  const w=deck[currentIndex];
  progress[w.word]={status,lastSeen:Date.now()};saveProgress();updateStats();
  currentIndex=(currentIndex+1)%deck.length;
  if(status==="known")buildDeck();else showCard()
}
document.querySelectorAll(".filter-btn").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");
  currentFilter=btn.dataset.cat;buildDeck()
}));
document.getElementById("btnKnow").addEventListener("click",()=>mark("known"));
document.getElementById("btnUnknown").addEventListener("click",()=>mark("unknown"));
document.getElementById("btnNext").addEventListener("click",()=>{if(deck.length){currentIndex=(currentIndex+1)%deck.length;showCard()}});
document.getElementById("card").addEventListener("click",()=>document.getElementById("card").classList.toggle("flipped"));
initProgress();buildDeck();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
let deferredPrompt=null;const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(installBtn)installBtn.style.display='block'});
if(installBtn)installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'});
window.addEventListener('appinstalled',()=>{if(installBtn)installBtn.style.display='none';deferredPrompt=null});
</script>
